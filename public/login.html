<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Minecraft Server</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html[data-theme="light"], html:not([data-theme]) {
      --bg: #f5fffe; --card: #ffffff; --accent: #0891b2; --text: #0f172a; --muted: #334155;
      --border: rgba(8,145,178,0.22); --nav-bg: rgba(255,255,255,0.95); --btn-text: #fff;
    }
    html[data-theme="dark"] {
      --bg: #070b12; --card: #0f1621; --accent: #22d3ee; --text: #f8fafc; --muted: #cbd5e1;
      --border: rgba(34,211,238,0.22); --nav-bg: rgba(7,11,18,0.95); --btn-text: #083344;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .bg-glow {
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .g1 { top: -100px; left: -80px; background: radial-gradient(circle, rgba(6,182,212,0.3), transparent 70%); }
    .g2 { bottom: -100px; right: -60px; background: radial-gradient(circle, rgba(88,101,242,0.25), transparent 70%); }
    .card {
      position: relative; z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .card h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #06b6d4, #0d9488);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card p.sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.8rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.15);
    }
    .btn {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      border: none;
      border-radius: 12px;
      color: #04100a;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6,182,212,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: none;
    }
    .msg.error { display: block; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .msg.success { display: block; background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.3); color: #67e8f9; }
    .links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--muted); }
    .links a { color: var(--accent-bright); text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    .back { display: inline-block; margin-bottom: 1.2rem; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: var(--accent-bright); }
  
    /* Floating theme swipe */
    .theme-fab {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 0;
      width: 72px;
      height: 36px;
      padding: 3px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card, var(--card, #fff));
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.18);
      cursor: pointer;
      user-select: none;
      transition: background 0.25s, border-color 0.25s;
    }
    .theme-fab-knob {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--gradient, linear-gradient(135deg, #22d3ee, #0891b2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(8, 145, 178, 0.35);
      color: #fff;
    }
    [data-theme="dark"] .theme-fab-knob {
      transform: translateX(36px);
    }
    .theme-fab-track {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      pointer-events: none;
      font-size: 0.7rem;
      opacity: 0.55;
    }

  </style>


<script>
(function(){
  var t = localStorage.getItem('mc_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  function sync(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var knob = document.getElementById('themeKnob');
    if (knob) knob.textContent = dark ? '🌙' : '☀️';
  }
  function bind(){
    sync();
    var b = document.getElementById('themeToggle');
    if (!b || b._bound) return;
    b._bound = true;
    b.addEventListener('click', function(){
      var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      localStorage.setItem('mc_theme', n);
      sync();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>


</head>
<body>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="card">
    <a href="/" class="back">← Back to Home</a>
    <h1>Login</h1>
    <p class="sub">Sign in to your account</p>
    <div class="msg" id="msg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6" />
      </div>
      <button type="submit" class="btn" id="btn">Login</button>
    </form>
    <div class="links">
      Don't have an account? <a href="/register.html">Register</a>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      msg.className = 'msg';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          msg.className = 'msg success';
          msg.textContent = data.message;
          setTimeout(() => {
            const next = new URLSearchParams(location.search).get('next');
            if (next && next.startsWith('/')) location.href = next;
            else location.href = data.user.role === 'admin' ? '/admin/' : '/';
          }, 800);
        } else {
          msg.className = 'msg error';
          msg.textContent = data.message;
          btn.disabled = false;
          btn.textContent = 'Login';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Could not connect to server';
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>

  <script>
    (async function(){
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        if (!data.success) return;
        const url = data.settings.favicon || data.settings.logo;
        if (!url) return;
        let link = document.querySelector("link[rel='icon']") || document.createElement('link');
        link.rel = 'icon';
        link.href = url;
        document.head.appendChild(link);
        document.title = (data.settings.siteName || 'Server') + (document.title.includes('Login') ? ' - Login' : document.title.includes('Register') ? ' - Register' : '');
      } catch(e) {}
    })();
  </script>
</body>
</html>
